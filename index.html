<html lang="ko">
<head>

<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1510; --paper:#2a1d16; --ink:#f5e6d3; --muted:#c7a98f; --line:#4a3426;

  --bg:#1f1510; --paper:#2a1d16; --ink:#f5e6d3; --muted:#c7a98f; --line:#4a3426;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 64px}
header{text-align:center;margin-bottom:22px}
.eyebrow{font-family:var(--f-soft);color:var(--maple);font-size:1.05rem}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.15;margin:4px 0 8px}
.lead{color:var(--muted);font-size:.95rem;margin:0}
.roles{display:grid;gap:12px;margin-top:22px}
.role{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border:2px solid var(--line);border-radius:16px;background:var(--paper);color:inherit;font:inherit;text-align:left;cursor:pointer}
.role:hover,.role:focus-visible{border-color:var(--maple);outline:none}

.bar .who{font-weight:700}

.q.sec{background:none;border:0;padding:14px 2px 2px;margin-bottom:6px}
.q.sec h2{font-family:var(--f-soft);font-size:1.2rem;color:var(--wine);margin:0}
.q.sec p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.q .t{font-weight:700;margin:0 0 4px}
.q .t em{font-style:normal;color:var(--maple);margin-right:4px}
.q .h{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.q.miss{border-color:var(--maple);box-shadow:0 0 0 2px color-mix(in srgb,var(--maple) 30%,transparent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.scale label,.opts label{position:relative;cursor:pointer}
.scale input,.opts input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border:2px solid var(--line);border-radius:12px;font-size:.78rem;text-align:center;color:var(--muted);min-height:74px;justify-content:center}
.scale span i{font-style:normal;font-size:1.6rem;line-height:1.1}
.opts span{display:block;padding:9px 14px;border:2px solid var(--line);border-radius:99px;font-size:.95rem}
.scale input:checked+span,.opts input:checked+span{border-color:var(--maple);background:var(--chip);color:var(--ink);font-weight:700}
.scale input:focus-visible+span,.opts input:focus-visible+span{outline:2px solid var(--maple);outline-offset:2px}
textarea{width:100%;min-height:92px;margin-top:8px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:.98rem;resize:vertical}
textarea:focus{outline:none;border-color:var(--maple)}
.send{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:var(--maple);color:#fff;font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.msg{margin-top:10px;text-align:center;color:var(--maple);font-size:.92rem;min-height:1.4em}
.done{text-align:center;padding:48px 8px}
.done .big{font-size:3.4rem}
.done h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:8px 0}
.done p{color:var(--muted)}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
</style>
</head>

// ===== 질문 =====
// s: 5점 척도 · c: 하나 고르기 · t: 글쓰기 · sec: 묶음 제목 · opt: 선택(안 해도 됨)

const SURVEY = {

    { id:'p_intro', type:'s', t:'무대 화면의 팀 소개(사진 · 소개글)는 마음에 드셨나요?' },

    { id:'p_care', type:'s', t:'점심 · 공연수당 등 참가자 지원은 어땠나요?' },
    ...COMMON_END
  ]},
  staff: { name:'업무 직원', qs:[
    { id:'s_part', type:'c', t:'오늘 주로 맡은 일은 무엇이었나요?', opt:true,
      o:['무대 · 진행','부스 운영','참가팀 관리','안내 · 접수','식사 · 물품','차량 · 이동','기타'] },
    { sec:'준비와 업무' },
    { id:'s_assign', type:'s', t:'업무 분장(누가 무엇을 하는지)이 미리 분명하게 안내되었나요?' },
    { id:'s_app', type:'s', t:'업무분장 앱(휴대폰 화면)은 일하는 데 도움이 되었나요?' },
    { id:'s_load', type:'c', t:'맡은 일의 양은 어땠나요?', o:['적었어요','알맞았어요','많았어요'] },

    { id:'s_team', type:'s', t:'직원 · 자원봉사자 사이의 협업과 연락은 잘 되었나요?' },

  ]},
  volunteer: { name:'자원봉사자', qs:[

      o:['부스 운영','안내 · 길 안내','무대 · 진행 보조','물품 · 식사','기타'] },
    { id:'v_who', type:'c', t:'어떻게 참여하셨나요?', opt:true, o:['대학 수어동아리','협회 · 지회 회원','개인 참여','기타'] },
    { sec:'활동 전' },
    { id:'v_info', type:'s', t:'활동 내용 · 시간 · 장소 안내를 미리 충분히 받았나요?' },
    { id:'v_role', type:'s', t:'현장에서 내가 할 일을 바로 알 수 있었나요?' },

    { id:'v_rest', type:'s', t:'쉬는 시간은 충분했나요?' },
    { id:'v_food', type:'s', t:'점심 · 간식 · 음료는 어땠나요?' },
    { id:'v_car', type:'s', t:'차량 이동은 편했나요?', h:'차량을 이용하지 않았다면 건너뛰세요.', opt:true },
    { id:'v_help', type:'s', t:'궁금하거나 어려울 때 직원에게 쉽게 물어볼 수 있었나요?' },
    { id:'v_mean', type:'s', t:'농인과 수어로 소통하고 수어 문화를 경험한 시간이 의미 있었나요?' },

  ]}
};

// ===== 화면 그리기 =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let role = null;

function render(r) {
  role = r; const sv = SURVEY[r]; let n = 0;
  $('#who').textContent = sv.name;
  $('#qs').innerHTML = sv.qs.map(q => {
    if (q.sec) return '<div class="q sec"><h2>' + esc(q.sec) + '</h2>' + (q.p ? '<p>' + esc(q.p) + '</p>' : '') + '</div>';
    n++;
    const head = '<p class="t" id="t_' + q.id + '"><em>' + n + '.</em>' + esc(q.t) + (q.opt ? ' <small style="color:var(--muted);font-weight:400">(선택)</small>' : '') + '</p>' + (q.h ? '<p class="h">' + esc(q.h) + '</p>' : '');
    let body = '';
    if (q.type === 's') body = '<div class="scale" role="radiogroup" aria-labelledby="t_' + q.id + '">' + S5.map((s, i) => '<label><input type="radio" name="' + q.id + '" value="' + (i + 1) + '"><span><i>' + s[0] + '</i>' + s[1] + '</span></label>').join('') + '</div>';
    if (q.type === 'c') body = '<div class="opts" role="radiogroup" aria-labelledby="t_' + q.id + '">' + q.o.map(o => '<label><input type="radio" name="' + q.id + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>').join('') + '</div>';
    if (q.type === 't') body = '<textarea name="' + q.id + '" aria-labelledby="t_' + q.id + '" maxlength="1000" placeholder="자유롭게 적어 주세요"></textarea>';
    return '<div class="q" data-id="' + q.id + '"' + (q.opt ? ' data-opt="1"' : '') + '>' + head + body + '</div>';
  }).join('');
  $('#pick').hidden = true; $('#done').hidden = true; $('#form').hidden = false; $('#msg').textContent = '';
  progress(); scrollTo(0, 0);
  try { history.replaceState(null, '', '?r=' + r); } catch (e) {}
}
function answers() {
  const fd = new FormData($('#form')), a = {};
  for (const [k, v] of fd.entries()) { const t = String(v).trim(); if (t) a[k] = /^[1-5]$/.test(t) && SURVEY[role].qs.find(q => q.id === k && q.type === 's') ? +t : t; }
  return a;
}
function progress() {
  const need = SURVEY[role].qs.filter(q => q.id && !q.opt), a = answers();
  $('#pg').style.width = (need.length ? need.filter(q => a[q.id] != null).length / need.length * 100 : 0) + '%';
}
document.querySelectorAll('.role').forEach(b => b.addEventListener('click', () => render(b.dataset.r)));
$('#back').addEventListener('click', () => { $('#form').hidden = true; $('#pick').hidden = false; try { history.replaceState(null, '', location.pathname); } catch (e) {} });
$('#form').addEventListener('change', e => { const q = e.target.closest('.q'); if (q) q.classList.remove('miss'); progress(); });

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const a = answers(), miss = SURVEY[role].qs.filter(q => q.id && !q.opt && a[q.id] == null);
  document.querySelectorAll('.q.miss').forEach(x => x.classList.remove('miss'));
  if (miss.length) {
    miss.forEach(q => document.querySelector('.q[data-id="' + q.id + '"]').classList.add('miss'));
    document.querySelector('.q[data-id="' + miss[0].id + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('#msg').textContent = '표시된 ' + miss.length + '개 문항에 답해 주세요.'; return;
  }
  const btn = $('#send'); btn.disabled = true; btn.textContent = '보내는 중…'; $('#msg').textContent = '';
  let error = null;
  try { if (!db) throw new Error('offline'); ({ error } = await db.from(TABLE).insert({ role, answers: a })); } catch (err) { error = err; }
  btn.disabled = false; btn.textContent = '의견 보내기';
  if (error) { $('#msg').textContent = '보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. (적은 내용은 그대로 있어요)'; return; }
  $('#form').hidden = true; $('#done').hidden = false; scrollTo(0, 0);
});

// 링크에 ?r=performer / staff / volunteer 를 붙이면 바로 그 설문이 열려요
const pr = new URLSearchParams(location.search).get('r');
if (SURVEY[pr]) render(pr);
</script>
</body>
